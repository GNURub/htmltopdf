<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Generic spacing shorthand fixture</title>
  <style>
    .outer {
      margin: 24px 48px 12px 96px;
      padding: 24px 36px 18px 48px;
      background: #eff6ff;
      border-radius: 18px;
    }
    .inner {
      margin: 12px 24px;
      padding: 10px 20px 16px;
      background: #ffffff;
      border-radius: 10px;
    }
    h1 { color: #1d4ed8; }
    p { color: #475569; line-height: 20px; }
  </style>
</head>
<body>
  <main class="outer">
    <h1>Spacing shorthand</h1>
    <p>Four-value margin and padding should affect container geometry.</p>
    <section class="inner">
      <p>Two and three value shorthands should resolve like CSS: vertical/horizontal and top/horizontal/bottom.</p>
    </section>
  </main>
</body>
</html>
