<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Generic border fixture</title>
  <style>
    .card {
      margin: 24px 48px;
      padding: 22px 28px;
      background: #f8fafc;
      border: 2px solid #2563eb;
      border-radius: 16px;
    }
    .inner {
      margin-top: 16px;
      padding: 14px;
      background: #ffffff;
      border-width: 1px;
      border-style: dashed;
      border-color: #bfdbfe;
      border-radius: 10px;
    }
    h1 { color: #1d4ed8; }
    p { color: #475569; line-height: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Generic borders</h1>
    <p>Border shorthand should paint around rounded background containers.</p>
    <section class="inner">
      <p>Border width and border color longhands should also work.</p>
    </section>
  </main>
</body>
</html>
