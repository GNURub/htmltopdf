<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Generic border side fixture</title>
  <style>
    .panel { margin: 2rem; padding: 1rem; background: #ffffff; border-left: 4px solid #2563eb; border-bottom: 1px solid #cbd5e1; }
    .panel h1 { font-size: 1.5rem; border-bottom: 1px solid #111827; padding-bottom: .5rem; }
  </style>
</head>
<body>
  <section class="panel">
    <h1>Border sides</h1>
    <p>Single-side borders should paint without requiring a full border box.</p>
  </section>
</body>
</html>
