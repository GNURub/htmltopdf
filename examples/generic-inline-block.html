<!doctype html>
<html><head><meta charset="utf-8"><style>
@page { size: 320pt 240pt; margin: 20pt; }
body { margin: 0; font: 10pt Arial, sans-serif; line-height: 14pt; }
p { margin: 0 0 14pt; }
.badge { display: inline-block; padding: 4pt; background: #dbeafe; }
.row { width: 150pt; }
.tile { display: inline-block; width: 60pt; height: 28pt; padding: 4pt;
        background: #dcfce7; }
.empty { display: inline-block; width: 20pt; height: 20pt; background: #fde68a; }
</style></head><body>
<p>Before <span class="badge">inline <strong>badge</strong></span> after.</p>
<div class="row"><span class="tile">First</span><span class="tile">Second</span><span class="tile">Third</span></div>
<p>Text <span class="empty"></span> aligned to an empty box.</p>
</body></html>
